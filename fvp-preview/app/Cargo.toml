[package]
name = "fvp-preview"
version = "0.1.0"
edition = "2021"
description = "HCB preview window: renders prim snapshots with rfvp-identical transforms"
license = "MPL-2.0"

[[bin]]
name = "fvp-preview"
path = "src/main.rs"

[dependencies]
fvp-preview-core = { path = "../core" }
eframe = "0.27"
egui = "0.27"
image = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
