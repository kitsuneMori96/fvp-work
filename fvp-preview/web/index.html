<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>fvp-preview web</title>
<style>
  body { margin:0; background:#111; color:#ddd; font-family:sans-serif; display:flex; height:100vh; }
  #left { flex:1; overflow:auto; display:flex; align-items:flex-start; justify-content:center; background:#111; }
  canvas { background:#181818; margin:12px; image-rendering:auto; cursor:crosshair; }
  #right { width:300px; min-width:300px; border-left:1px solid #333; overflow-y:auto; padding:8px; font-size:13px; }
  #topbar { position:fixed; top:0; left:0; right:300px; background:#1c1c1c; padding:4px 10px; font-size:12px; border-bottom:1px solid #333; z-index:5;}
  #wrap { padding-top:30px; display:flex; width:100%; height:100%; box-sizing:border-box;}
  h3 { margin:10px 0 4px; font-size:13px; color:#fff;}
  .row { display:flex; align-items:center; gap:6px; padding:2px 0;}
  .row.sel { background:#2a3a55; }
  button { background:#2a2a2a; color:#ddd; border:1px solid #555; border-radius:4px; padding:2px 8px; cursor:pointer;}
  button:hover { background:#3a3a3a; }
  input[type=number] { width:70px; background:#222; color:#ddd; border:1px solid #555; border-radius:3px;}
  input[type=text] { background:#222; color:#ddd; border:1px solid #555; border-radius:3px;}
  .unmapped { color:#f66; }
  .ok { color:#8f8; } .bad { color:#f66; }
  #layers, #replaylist { max-height:200px; overflow-y:auto; border:1px solid #333; }
  small { color:#999; }
  #selftest { font-weight:bold; }
</style>
</head>
<body>
<div id="topbar"><span id="status">未加载</span> <span id="dpinfo" style="color:#999"></span> <span id="selftest"></span></div>
<div id="wrap">
<div id="left"><canvas id="cv" width="1280" height="720"></canvas></div>
<div id="right">
  <h3>场景 <small id="srcInfo"></small></h3>
  <div class="row"><button id="btnSample">载入示例工程</button><button id="btnRefresh">刷新</button></div>
  <div class="row"><small>本地文件上传到服务端（服务端目录见上，固定目录直接放文件后按刷新）：</small></div>
  <div class="row"><small>scene <input type="file" id="fScene" accept=".json"></small></div>
  <div class="row"><small>replay <input type="file" id="fReplay" accept=".json"></small></div>
  <div class="row"><small>addrmap <input type="file" id="fMap" accept=".json"></small></div>
  <div class="row"><small id="upStatus"></small></div>
  <h3>脚本序列 <span id="rCount"></span></h3>
  <div class="row"><button id="rPrev">◀</button><input type="range" id="rSlider" min="0" max="0" value="0" style="flex:1"><button id="rNext">▶</button></div>
  <div class="row"><small id="rLabel">无回放</small></div>
  <div class="row"><small>过滤 <input type="text" id="rFilter" size="18" placeholder="如 258 / PrimSetXY"></small></div>
  <div id="scriptList" tabindex="0" style="max-height:260px;overflow-y:auto;border:1px solid #333;font-family:monospace;font-size:12px;"></div>
  <div class="row"><small>点行/↑↓/slider 切帧（<label><input type="checkbox" id="followT"> 跟随滚动</label>；默认只高亮不抢滚动条）</small></div>
  <h3>剧本txt <span id="txtPath"></span></h3>
  <div><textarea id="txtEd" spellcheck="false" style="width:100%;height:220px;background:#1a1a1a;color:#ddd;border:1px solid #333;font-family:monospace;font-size:12px;white-space:pre;" placeholder="服务端配 --simple-dir 后在此直接写剧本"></textarea></div>
  <div class="row"><button id="btnRebuild">全量重跑（时间线）</button><small id="txtStatus">未连接剧本</small></div>
  <div class="row"><small>编辑框光标停哪行→即时断点预览（秒级）；改文本自动即时；全量重跑才刷时间线</small></div>
  <div class="row"><button id="btnExport">导出PNG系列</button><small id="expStatus"></small></div>
  <h3>图层（顶→底）</h3>
  <div id="layers"></div>
  <div class="row"><button id="btnClearHide">全部恢复</button></div>
  <h3>编辑 <span id="edId"></span></h3>
  <div id="editor"></div>
  <h3>写回</h3>
  <div id="pending"></div>
  <div class="row"><button id="btnWrite">写回 HCB</button></div>
  <div class="row"><small id="writeStatus"></small></div>
  <div class="row"><small id="wbPaths">路径由服务端配置（启动参数 --hcb/--addrmap/--out-hcb）</small></div>
</div>
</div>
<script>
"use strict";
// ---------------- 数学（直译 core/src/{affine,model}.rs） ----------------
const TAU = Math.PI * 2;
const I2 = () => ({m11:1,m12:0,m21:0,m22:1,tx:0,ty:0});
const TR = (x,y) => ({m11:1,m12:0,m21:0,m22:1,tx:x,ty:y});
const SC = (x,y) => ({m11:x,m12:0,m21:0,m22:y,tx:0,ty:0});
const RO = (r) => { const c=Math.cos(r), s=Math.sin(r); return {m11:c,m12:-s,m21:s,m22:c,tx:0,ty:0}; };
function MUL(a,b){ return {
  m11:a.m11*b.m11+a.m12*b.m21, m12:a.m11*b.m12+a.m12*b.m22,
  m21:a.m21*b.m11+a.m22*b.m21, m22:a.m21*b.m12+a.m22*b.m22,
  tx:a.m11*b.tx+a.m12*b.ty+a.tx,  ty:a.m21*b.tx+a.m22*b.ty+a.ty }; }
function CHAIN(ms){ return ms.reduce((a,b)=>MUL(a,b)); }
function TP(m,x,y){ return [m.m11*x+m.m12*y+m.tx, m.m21*x+m.m22*y+m.ty]; }
function INV(m){ const d=m.m11*m.m22-m.m12*m.m21; if(Math.abs(d)<1e-12) return null;
  const q=1/d, a=m.m22*q, b=-m.m12*q, c=-m.m21*q, e=m.m11*q;
  return {m11:a,m12:b,m21:c,m22:e,tx:-(a*m.tx+b*m.ty),ty:-(c*m.tx+e*m.ty)}; }
function pivotOf(p){ return (p.attr&2) ? [p.opx||0, p.opy||0] : [p.u||0, p.v||0]; }
function buildModel(p, px, py, cam, vp){
  const theta = -(p.angle||0)*TAU/3600;
  const X = px+(p.x||0), Y = py+(p.y||0);
  const [qx,qy] = pivotOf(p);
  const lx = (p.off_x||0)-qx, ly = (p.off_y||0)-qy;
  if ((p.attr&4)){
    const cx=vp.w*0.5, cy=vp.h*0.5;
    let fx=p.factor_x??1000, fy=p.factor_y??1000;
    if (Math.abs(fx)<1e-6) fx=1; if (Math.abs(fy)<1e-6) fy=1;
    let depth=(p.z||0)-(cam.z||0); if (Math.abs(depth)<1e-3) depth=1;
    const sx=fx/depth, sy=fy/depth;
    const shx=1000*(cam.x||0)/fx, shy=1000*(cam.y||0)/fy;
    return CHAIN([TR(cx,cy),SC(sx,sy),TR(X-shx,Y-shy),RO(theta),TR(lx,ly)]);
  }
  const sx=(p.factor_x??1000)/1000, sy=(p.factor_y??1000)/1000;
  return CHAIN([TR(X+qx,Y+qy),SC(sx,sy),RO(theta),TR(lx,ly)]);
}
// ---------------- 自测（core/model.rs 12 单测的输入输出） ----------------
function selfTest(){
  const VP={w:800,h:600}, C0={x:0,y:0,z:0};
  const B=()=>({x:0,y:0,z:0,angle:0,factor_x:1000,factor_y:1000,attr:0,opx:0,opy:0,u:0,v:0,off_x:0,off_y:0});
  const eq=(a,b)=>Math.abs(a[0]-b[0])<1e-3&&Math.abs(a[1]-b[1])<1e-3;
  const T=[];
  let p=B(); p.x=100;p.y=200; T.push(eq(TP(buildModel(p,0,0,C0,VP),10,20),[110,220]));
  p=B(); p.angle=900; T.push(eq(TP(buildModel(p,0,0,C0,VP),10,0),[0,-10]));
  p=B(); p.u=7;p.v=9; T.push(JSON.stringify(pivotOf(p))===JSON.stringify([7,9]));
  p.attr=2;p.opx=50;p.opy=60; T.push(JSON.stringify(pivotOf(p))===JSON.stringify([50,60]));
  p=B(); p.x=100;p.y=100;p.attr=2;p.opx=50;p.opy=50; T.push(eq(TP(buildModel(p,0,0,C0,VP),0,0),[100,100]));
  p=B(); p.x=100;p.y=50;p.z=1100;p.attr=4; T.push(eq(TP(buildModel(p,0,0,{x:0,y:0,z:100},VP),0,0),[500,350]));
  p=B(); p.x=100;p.y=50;p.z=1100;p.attr=4; T.push(eq(TP(buildModel(p,0,0,{x:200,y:0,z:100},VP),0,0),[300,350]));
  p=B(); p.x=100;p.y=50;p.z=1100;p.attr=6;p.opx=50;p.opy=50;
  T.push(eq(TP(buildModel(p,0,0,{x:0,y:0,z:100},VP),0,0),[450,300]));
  p.attr=2; T.push(eq(TP(buildModel(p,0,0,C0,VP),0,0),[100,50]));
  p=B(); p.z=500;p.attr=4; T.push(eq(TP(buildModel(p,0,0,{x:0,y:0,z:500},VP),1,0),[1400,300]));
  p=B(); p.z=1000;p.factor_x=0;p.factor_y=1000;p.attr=4; T.push(eq(TP(buildModel(p,0,0,C0,VP),1000,0),[401,300]));
  p=B(); p.x=100;p.y=200; T.push(eq(TP(buildModel(p,30,40,C0,VP),0,0),[130,240]));
  p=B(); p.factor_x=2000;p.factor_y=500; T.push(eq(TP(buildModel(p,0,0,C0,VP),10,10),[20,5]));
  return T;
}
// ---------------- 状态 ----------------
const cv = document.getElementById('cv'), ctx2d = cv.getContext('2d');
let scene=null, replay=null, ridx=0, addrmap={};
let selected=null, hidden=new Set(), solo=null, orig=new Map(), texCache=new Map();
let zoom=1;
const FIELDS=[["x","px整数"],["y","px整数"],["z","100..10000透视除数"],["angle","十分之一度%3600"],["fx","千分比"],["fy","千分比"],["attr","bit:2=OP,4=透视"],["opx","px(需attr&2)"],["opy","px(需attr&2)"],["alpha","0..255"]];
function P(p,k,d){ const v=p[k]; return (v===undefined||v===null)?d:v; }
function params(p){ return {x:P(p,'x',0),y:P(p,'y',0),z:P(p,'z',0),angle:P(p,'angle',0),factor_x:P(p,'fx',1000),factor_y:P(p,'fy',1000),attr:P(p,'attr',0),opx:P(p,'opx',0),opy:P(p,'opy',0),u:P(p,'u',0),v:P(p,'v',0),off_x:P(p,'off_x',0),off_y:P(p,'off_y',0),w:P(p,'w',0),h:P(p,'h',0),gw:P(p,'gw',0),gh:P(p,'gh',0)}; }
// ---------------- 树序（DFS，draw=false 连子树跳过，父 x/y 累加） ----------------
function drawOrder(prms){
  const idx=new Map(prms.map((p,i)=>[p.id,i])), kids=new Map();
  prms.forEach((p,i)=>{ const k=(p.parent!=null&&idx.has(p.parent))?p.parent:null;
    if(!kids.has(k))kids.set(k,[]); kids.get(k).push(i); });
  const out=[], stack=(kids.get(null)||[]).map(i=>({i,px:0,py:0,hid:false})); stack.reverse();
  let g=0;
  while(stack.length){ if(++g>65536)break; const {i,px,py,hid}=stack.pop();
    const p=prms[i], h=hid||!P(p,'draw',true);
    if(!h) out.push({i,px,py});
    const ch=kids.get(p.id)||[];
    for(let k=ch.length-1;k>=0;k--) stack.push({i:ch[k],px:px+(P(p,'x',0)),py:py+(P(p,'y',0)),hid:h});
  }
  return out;
}
function visible(id){ if(solo!==null) return id===solo; return !hidden.has(id); }
// ---------------- 贴图 ----------------
function texURL(path){ return '/api/tex?path='+encodeURIComponent(path); }
function loadTex(path){ if(!path) return Promise.resolve(null);
  if(texCache.has(path)) return texCache.get(path);
  const pr=new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=texURL(path); });
  texCache.set(path,pr); return pr; }
// ---------------- 渲染 ----------------
let renderGen=0; // 代际守卫：切行后旧渲染的异步贴图回來直接丟棄，防串台
async function render(){
  const gen=++renderGen;
  if(!scene){ ctx2d.fillStyle='#181818'; ctx2d.fillRect(0,0,cv.width,cv.height); return; }
  const vp=scene.viewport, cam=scene.camera||{x:0,y:0,z:0};
  cv.width=vp.w; cv.height=vp.h;
  ctx2d.setTransform(1,0,0,1,0,0); ctx2d.globalAlpha=1;
  ctx2d.fillStyle='#181818'; ctx2d.fillRect(0,0,cv.width,cv.height);
  const order=drawOrder(scene.prims);
  for(const {i,px,py} of order){
    const p=scene.prims[i];
    if(!p.image||!visible(p.id)) continue;
    const im=await loadTex(p.image); if(!im) continue;
    if(gen!==renderGen) return; // 已被新行取代：丢弃，不画
    const q=params(p);
    // 取图规则对标引擎 draw_sprite_prim：
    // attr&1 用 prim.w/h（<=0 回退 graph 逻辑尺寸），否则 graph 逻辑尺寸；
    // u = prim.u - graph.off（含负向裁剪：off 侧补 clip、宽收缩，钳制到解码边）。
    let dw, dh, su=0, sv=0;
    if((q.attr&1)!==0){
      dw=(q.w>0?q.w:(q.gw||im.width)); dh=(q.h>0?q.h:(q.gh||im.height));
      let u=q.u-q.off_x, v=q.v-q.off_y;
      if(u<0){q.off_x+=-u;dw+=u;u=0;} if(v<0){q.off_y+=-v;dh+=v;v=0;}
      dw=Math.min(dw,im.width-u); dh=Math.min(dh,im.height-v);
      if(dw<=0||dh<=0) continue;
      su=u; sv=v;
    } else {
      dw=(q.gw||im.width); dh=(q.gh||im.height);
      dw=Math.min(dw,im.width); dh=Math.min(dh,im.height);
    }
    const m=buildModel(q,px,py,cam,vp);
    ctx2d.setTransform(m.m11,m.m21,m.m12,m.m22,m.tx,m.ty);
    ctx2d.globalAlpha=(P(p,'alpha',255))/255;
    ctx2d.drawImage(im,su,sv,dw,dh,0,0,dw,dh);
  }
  ctx2d.setTransform(1,0,0,1,0,0); ctx2d.globalAlpha=1;
  // 选中框
  if(selected!==null){
    const o=drawOrder(scene.prims).find(o=>scene.prims[o.i].id===selected);
    if(o){ const p=scene.prims[o.i], im=await loadTex(p.image);
      if(gen!==renderGen) return;
      if(im){ const m=buildModel(params(p),o.px,o.py,cam,vp);
        const c=[[0,0],[im.naturalWidth,0],[im.naturalWidth,im.naturalHeight],[0,im.naturalHeight]].map(q=>TP(m,q[0],q[1]));
        ctx2d.strokeStyle='yellow'; ctx2d.lineWidth=2; ctx2d.beginPath();
        c.forEach((q,k)=>k?ctx2d.lineTo(q[0],q[1]):ctx2d.moveTo(q[0],q[1])); ctx2d.closePath(); ctx2d.stroke(); } }
  }
  fitZoom();
}
function fitZoom(){
  const availW=document.getElementById('left').clientWidth-24;
  zoom=Math.min(1,availW/cv.width);
  cv.style.width=(cv.width*zoom)+'px'; cv.style.height=(cv.height*zoom)+'px';
  document.getElementById('dpinfo').textContent=`画布${cv.width}x${cv.height}pt · 缩放${Math.round(zoom*100)}%`;
}
// ---------------- 场景采用 ----------------
function adopt(snap,label){
  scene=JSON.parse(JSON.stringify(snap));
  orig.clear();
  scene.prims.forEach(p=>FIELDS.forEach(([f])=>{ if(p[f]!==undefined) orig.set(p.id+':'+f,p[f]); }));
  if(selected!==null&&!scene.prims.some(p=>p.id===selected)) selected=null;
  document.getElementById('status').textContent=(label||'已加载')+`：${scene.prims.length} prim`;
  render(); renderLayers(); renderEditor();
}
function gotoRow(i){
  if(!replay||!replay.rows.length) return;
  ridx=Math.max(0,Math.min(replay.rows.length-1,i));
  const r=replay.rows[ridx];
  adopt({viewport:replay.viewport,camera:r.camera||replay.camera||{x:0,y:0,z:0},prims:r.prims},`脚本行 ${ridx+1}/${replay.rows.length}`);
  document.getElementById('rSlider').value=ridx;
  document.getElementById('rLabel').textContent=`#${r.seq} ${r.label}`;
  markScriptCursor(true);
  // P2 反向同步：回放行 → txt 光标（不抢焦点，只挪光标）
  syncTxtCursor(r);
  // tick边界提示：同tick多行只有末行=游戏实际呈现帧，其余是脚本执行中间态
  const nxt=replay.rows[ridx+1];
  if(r.tick!==undefined){
    const mid=nxt&&nxt.tick===r.tick;
    document.getElementById('status').textContent+=mid?` · tick ${r.tick} 中间态（末行才=游戏帧）`:` · tick ${r.tick} 游戏帧`;
  }
}
// ---------------- 脚本 surviving（行=回放行，光标移到哪预览到哪） ----------------
function scriptFilter(){ return document.getElementById('rFilter').value.trim(); }
function renderScriptList(){
  const el=document.getElementById('scriptList'); el.innerHTML='';
  if(!replay||!replay.rows.length){ el.textContent='无回放'; return; }
  const f=scriptFilter();
  const frag=document.createDocumentFragment();
  replay.rows.forEach((r,i)=>{
    if(f && !(('#'+r.seq+' '+r.label).includes(f))) return;
    const d=document.createElement('div');
    d.textContent=`${String(i+1).padStart(4,' ')}  #${r.seq} ${r.label}`;
    d.style.cssText='white-space:pre;padding:1px 4px;cursor:pointer;'+(i===ridx?'background:#2a3a55;color:#fff;':'');
    d.dataset.i=i;
    d.onclick=()=>gotoRow(i);
    frag.append(d);
  });
  el.append(frag);
  markScriptCursor(false);
}
function markScriptCursor(scroll){
  const el=document.getElementById('scriptList');
  const follow=document.getElementById('followT')&&document.getElementById('followT').checked;
  [...el.children].forEach(c=>{ const on=parseInt(c.dataset.i,10)===ridx;
    c.style.background=on?'#2a3a55':''; c.style.color=on?'#fff':'';
    if(on&&scroll&&follow) c.scrollIntoView({block:'nearest'}); });
}
// ---------------- 图层 ----------------
function renderLayers(){
  const el=document.getElementById('layers'); el.innerHTML='';
  if(!scene) return;
  const order=drawOrder(scene.prims); const rev=[...order].reverse();
  rev.forEach(({i})=>{ const p=scene.prims[i]; if(!p.image) return;
    const d=document.createElement('div'); d.className='row'+(selected===p.id?' sel':'');
    const eye=!hidden.has(p.id);
    d.innerHTML=`<button>${eye?'眼':'··'}</button>`;
    const b=document.createElement('button'); b.textContent='#'+p.id;
    b.onclick=()=>{selected=p.id; render(); renderLayers(); renderEditor();};
    const s=document.createElement('button'); s.textContent='solo'; if(solo===p.id)s.style.background='#5a3a00';
    s.onclick=()=>{solo=(solo===p.id)?null:p.id; render(); renderLayers();};
    const info=document.createElement('small'); info.textContent=`${P(p,'x',0)},${P(p,'y',0)} a${P(p,'alpha',255)}`;
    d.children[0].onclick=()=>{ eye?hidden.add(p.id):hidden.delete(p.id); render(); renderLayers(); };
    d.append(b,s,info); el.append(d);
  });
}
// ---------------- 编辑 ----------------
function pendingEdits(){
  if(!scene) return [];
  const out=[];
  scene.prims.forEach(p=>FIELDS.forEach(([f])=>{ const k=p.id+':'+f;
    if(orig.has(k)&&p[f]!==undefined&&p[f]!==orig.get(k)) out.push({id:p.id,field:f,value:p[f]}); }));
  return out;
}
function renderEditor(){
  const ed=document.getElementById('editor'); ed.innerHTML='';
  document.getElementById('edId').textContent=selected===null?'(点击图层或画布选中)':'#'+selected;
  if(selected===null||!scene) return;
  const p=scene.prims.find(q=>q.id===selected); if(!p) return;
  FIELDS.forEach(([f,unit])=>{ if(p[f]===undefined) return;
    const mapped=addrmap[p.id]&&addrmap[p.id][f]!==undefined;
    const d=document.createElement('div'); d.className='row';
    const lab=document.createElement('span'); lab.textContent=f; if(!mapped)lab.className='unmapped';
    const inp=document.createElement('input'); inp.type='number'; inp.value=p[f]; inp.step=1;
    inp.onchange=()=>{ p[f]=parseInt(inp.value||'0',10); render(); renderLayers(); renderEditor(); };
    const u=document.createElement('small'); u.textContent=unit;
    d.append(lab,inp,u); ed.append(d);
  });
  const pe=document.getElementById('pending');
  const edits=pendingEdits();
  pe.innerHTML=edits.length?edits.slice(0,12).map(e=>{const o=orig.get(e.id+':'+e.field);
    return `<div><small>#${e.id} ${e.field}: ${o} → ${e.value}</small></div>`;}).join('')+`<small>待写回 ${edits.length} 项</small>`:'<small>无改动</small>';
}
// ---------------- 画布交互 ----------------
function evPos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/zoom,(e.clientY-r.top)/zoom]; }
async function hitTest(x,y){
  if(!scene) return null;
  const vp=scene.viewport, cam=scene.camera||{x:0,y:0,z:0};
  const order=drawOrder(scene.prims); 
  for(let k=order.length-1;k>=0;k--){ const {i,px,py}=order[k], p=scene.prims[i];
    if(!p.image||!visible(p.id)) continue;
    const im=await loadTex(p.image); if(!im) continue;
    const inv=INV(buildModel(params(p),px,py,cam,vp)); if(!inv) continue;
    const [lx,ly]=TP(inv,x,y);
    if(lx>=0&&ly>=0&&lx<=im.naturalWidth&&ly<=im.naturalHeight) return p.id;
  }
  return null;
}
let dragging=false,lastXY=null;
cv.addEventListener('mousedown',async e=>{ const [x,y]=evPos(e);
  selected=await hitTest(x,y); dragging=true; lastXY=[x,y]; render(); renderLayers(); renderEditor(); });
window.addEventListener('mousemove',e=>{ if(!dragging||selected===null||!scene) return;
  const [x,y]=evPos(e), dx=Math.round(x-lastXY[0]), dy=Math.round(y-lastXY[1]);
  if(dx||dy){ const p=scene.prims.find(q=>q.id===selected);
    if(p&&(p.x!==undefined)){ p.x+=dx; p.y+=dy; lastXY=[x,y]; render(); renderLayers(); renderEditor(); } } });
window.addEventListener('mouseup',()=>dragging=false);
// ---------------- 文件（上传到服务端 + 来源显示） ----------------
// 老逻辑 FileReader 本地加载跨不过 WSL/Windows 文件系统边界；
// 现在文件选完直传服务端 sample_dir，固定目录放文件后按刷新即可。
function readText(file){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(null); r.readAsText(file); }); }
async function uploadKind(kind,text){
  const st=document.getElementById('upStatus');
  st.textContent=`上传 ${kind}…`;
  try{
    const r=await api('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:kind,text})});
    if(!r||!r.ok){ st.textContent=`上传失败：${(r&&r.error)||''}`; return; }
    st.textContent=`已存服务端：${r.path}`+(r.rows!=null?`（${r.rows}行）`:'');
    await refreshSample(false);
  }catch(e){ st.textContent='服务端未连接'; }
}
function bindUpload(id,kind){
  document.getElementById(id).onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    const t=await readText(f);
    if(t==null){ document.getElementById('upStatus').textContent='读文件失败'; return; }
    await uploadKind(kind,t);
    e.target.value=''; // 同一文件可重复选
  };
}
bindUpload('fScene','scene'); bindUpload('fReplay','replay'); bindUpload('fMap','addrmap');
// 服务端来源显示：sample 目录 + 各文件就绪状态 + 写回路径。
async function refreshPaths(){
  try{
    const h=await api('/api/paths');
    const yn=v=>v?`<span class="ok">✓</span>`:`<span class="bad">✗</span>`;
    document.getElementById('srcInfo').textContent=`服务端 ${h.sample_dir||''}`;
    document.getElementById('wbPaths').innerHTML=
      `hcb ${yn(h.hcb_ok)} <small>${h.hcb||'（未配 --hcb）'}</small><br>`+
      `addrmap ${yn(h.addrmap)} <small>${h.addrmap||''}</small><br>`+
      `输出 <small>${h.out_hcb||'（随 hcb）'}</small>`+
      (h.writeback_ready?'':`<br><span class="bad">写回未就绪：启动加 --hcb 游戏包路径 [--addrmap 映射表]</span>`);
  }catch(e){ /* 离线时保持占位 */ }
}
async function refreshSample(announce=true){
  try{
    const [s,r,m]=await Promise.all([api('/api/scene'),api('/api/replay'),api('/api/addrmap').catch(()=>null)]);
    if(s&&s.prims)adopt(s,'刷新');
    if(r&&r.rows){replay=r;ridx=0;buildLineMap();document.getElementById('rSlider').max=r.rows.length-1;
      document.getElementById('rCount').textContent=`${r.rows.length}行`;renderScriptList();gotoRow(0);}
    if(m&&m.addrmap)addrmap=m.addrmap;
    refreshPaths();
    if(announce)document.getElementById('upStatus').textContent='已从服务端重载';
  }catch(e){ document.getElementById('upStatus').textContent='服务端未连接'; }
}
document.getElementById('rFilter').oninput=()=>renderScriptList();
document.getElementById('scriptList').addEventListener('keydown',e=>{
  if(!replay||!replay.rows.length) return;
  if(e.key==='ArrowDown'){ gotoRow(ridx+1); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ gotoRow(ridx-1); e.preventDefault(); }
  else if(e.key==='PageDown'){ gotoRow(ridx+10); e.preventDefault(); }
  else if(e.key==='PageUp'){ gotoRow(ridx-10); e.preventDefault(); }
  else if(e.key==='Home'){ gotoRow(0); e.preventDefault(); }
  else if(e.key==='End'){ gotoRow(replay.rows.length-1); e.preventDefault(); }
});
document.getElementById('btnRefresh').onclick=()=>refreshSample(true);
document.getElementById('rPrev').onclick=()=>gotoRow(ridx-1);
document.getElementById('rNext').onclick=()=>gotoRow(ridx+1);
document.getElementById('rSlider').oninput=e=>gotoRow(parseInt(e.target.value,10));
document.getElementById('btnClearHide').onclick=()=>{hidden.clear();solo=null;render();renderLayers();};
window.addEventListener('resize',()=>{ if(scene) fitZoom(); });
// ---------------- P2/P3 剧本txt编辑+光标预览 ----------------
// P3 即时预览：编辑框光标 → /api/instant（编译缓存+break-pc快照），与全量时间线独立。
// 时间线列表默认只高亮不抢滚动（跟随复选框才滚），和编辑框滚动链彻底分离。
let txtTimer=null, txtPoll=null, rebuilding=false, suppressTxtSync=false, lineRowMap=new Map();
let txtLive=false, instSeq=0, instTimer=null;
function buildLineMap(){
  lineRowMap=new Map();
  if(!replay||!replay.rows) return;
  replay.rows.forEach((r,i)=>{ if(r.line!=null) lineRowMap.set(r.line,i); }); // 同行多次执行取末次
}
function mapLineToRow(L){
  for(let l=L;l>=1;l--) if(lineRowMap.has(l)) return lineRowMap.get(l);
  return replay&&replay.rows.length?0:-1;
}
function curTxtLine(){
  const t=document.getElementById('txtEd');
  return t.value.slice(0,t.selectionStart).split('\n').length;
}
function setTxtLine(L){
  const t=document.getElementById('txtEd');
  const lines=t.value.split('\n');
  if(L<1||L>lines.length) return;
  let pos=0; for(let k=0;k<L-1;k++) pos+=lines[k].length+1;
  suppressTxtSync=true;
  t.setSelectionRange(pos,pos);
  t.scrollTop=Math.max(0,(L-4)*18); // textarea 无行高亮，手动把光标滚进视野
  suppressTxtSync=false;
}
function syncTxtCursor(r){
  if(suppressTxtSync||!r||r.line==null) return;
  const cur=curTxtLine();
  if(cur!==r.line){ setTxtLine(r.line);
    document.getElementById('txtStatus').textContent=`#${r.seq} ← txt行${r.line}`; }
}
function followTxtCursor(){
  // P3: 光标/文本变化统一走即时预览（文本+行号一起发，服务端写盘后断点跑）。
  // 全量时间线只由「全量重跑」按钮刷新，不再自动整轮。
  if(!txtLive||suppressTxtSync) return;
  const L=curTxtLine();
  clearTimeout(instTimer);
  instTimer=setTimeout(()=>instantForLine(L),600);
}
async function instantForLine(L){
  if(!txtLive) return;
  const my=++instSeq;
  const st=document.getElementById('txtStatus');
  st.textContent=`即时预览 txt行${L}…`;
  let r=null;
  try{ r=await api('/api/instant',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:document.getElementById('txtEd').value,line:L})}); }
  catch(e){ if(my===instSeq) st.textContent='即时预览请求失败：'+e; return; }
  if(my!==instSeq) return; // 已被更新的光标取代
  if(r&&r.ok&&r.snapshot){
    adopt(r.snapshot,`即时 txt行${L}`);
    st.textContent=`txt行${L} → pc${r.pc} · ${r.ticks}ticks/${r.ms}ms`+(r.hit?'':` · 未命中行尾（分支外？${r.why||''}）`);
  } else {
    if(r&&/superseded/.test(r.error||'')) return; // 静默：新请求在路上
    const mm=/BUILD_FAIL_TXT_LINE=(\d+)/.exec((r&&r.error)||'');
    if(mm){ setTxtLine(parseInt(mm[1],10)); st.textContent=`构建失败 @txt行${mm[1]}`; }
    else st.textContent='即时预览失败：'+(((r&&r.error)||'').split('\n').slice(-2).join(' / ').slice(-140));
  }
}
async function loadTxt(){
  try{ const r=await api('/api/script');
    if(r&&r.ok){ document.getElementById('txtEd').value=r.text;
      document.getElementById('txtPath').textContent=r.path;
      document.getElementById('txtStatus').textContent='已载入，光标跟随中（即时）';
      txtLive=true;
    } else document.getElementById('txtStatus').textContent='无剧本（服务端配--simple-dir）';
  }catch(e){ document.getElementById('txtStatus').textContent='服务端未连接'; }
}
async function pollRebuild(job){
  const st=document.getElementById('txtStatus');
  txtPoll=setInterval(async ()=>{
    try{ const r=await api('/api/rebuild?job='+encodeURIComponent(job));
      if(r.state==='running'){ const tail=(r.log||'').split('\n').slice(-3).join(' / ');
        st.textContent=`重跑中… ${tail.slice(-90)}`; return; }
      clearInterval(txtPoll); txtPoll=null; rebuilding=false;
      if(r.state==='done'){
        const [s,rp]=await Promise.all([api('/api/scene'),api('/api/replay')]);
        if(s&&s.prims)adopt(s,'重跑完成');
        if(rp&&rp.rows){replay=rp;buildLineMap();
          document.getElementById('rSlider').max=rp.rows.length-1;
          document.getElementById('rCount').textContent=`${rp.rows.length}行`;
          renderScriptList();}
        followTxtCursor();
        st.textContent=`重跑完成 ${r.rows||'?'}行 ${r.diffs||''}`;
      } else {
        // 报错定位：BUILD_FAIL_TXT_LINE=N（桥脚本从 hcb_build 日志提取），
        // 回退：日志尾最后一个纯数字行+1。
        const mm=/BUILD_FAIL_TXT_LINE=(\d+)/.exec(r.error||'');
        const nums=mm?[parseInt(mm[1],10)]:[...(r.error||'').matchAll(/^(\d+)\s*$/gm)].map(m=>parseInt(m[1],10)+1);
        if(nums.length){ setTxtLine(nums[nums.length-1]);
          st.textContent=`构建失败 @txt行${nums[nums.length-1]}（见日志尾）`; }
        else st.textContent='重跑失败：'+((r.error||'').split('\n').slice(-2).join(' / ').slice(-120));
      }
    }catch(e){ clearInterval(txtPoll); txtPoll=null; rebuilding=false; st.textContent='轮询失败：'+e; }
  },2000);
}
async function startRebuild(){
  if(rebuilding) return;
  rebuilding=true;
  document.getElementById('txtStatus').textContent='保存剧本，启动重跑…';
  try{ const r=await api('/api/rebuild',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:document.getElementById('txtEd').value})});
    if(r&&r.ok&&r.job) pollRebuild(r.job);
    else { rebuilding=false; document.getElementById('txtStatus').textContent='启动失败：'+(r&&r.error||''); }
  }catch(e){ rebuilding=false; document.getElementById('txtStatus').textContent='服务端错误：'+e; }
}
// ---------------- 服务端联动 ----------------
async function api(path,opts){ const r=await fetch(path,opts); return r.json(); }
document.getElementById('btnSample').onclick=async ()=>{
  try{ const [s,r,m]=await Promise.all([api('/api/scene'),api('/api/replay'),api('/api/addrmap').catch(()=>null)]);
    if(s&&s.prims)adopt(s,'示例工程');
    if(r&&r.rows){replay=r;ridx=0;buildLineMap();document.getElementById('rSlider').max=r.rows.length-1;
      document.getElementById('rCount').textContent=`${r.rows.length}行`;renderScriptList();gotoRow(0);}
    if(m&&m.addrmap)addrmap=m.addrmap;
    loadTxt();
    refreshPaths();
  }catch(e){ document.getElementById('status').textContent='服务端未连接'; }
};
document.getElementById('btnWrite').onclick=async ()=>{
  const edits=pendingEdits();
  const unmapped=edits.filter(e=>!(addrmap[e.id]&&addrmap[e.id][e.field]!==undefined));
  const st=document.getElementById('writeStatus');
  if(unmapped.length){ st.innerHTML=`<span class="bad">拒绝：无常量源 ${unmapped.map(e=>e.id+'.'+e.field).join(',')}</span>`; return; }
  if(!edits.length){ st.textContent='无改动'; return; }
  // 路径只用服务端配置（--hcb/--addrmap/--out-hcb）：浏览器填的路径服务端够不着。
  try{ const r=await api('/api/writeback',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({edits})});
    st.innerHTML=r.ok?`<span class="ok">写回成功 → ${r.out}</span>`:`<span class="bad">写回失败：${r.error}</span>`;
  }catch(e){ st.innerHTML=`<span class="bad">服务端错误：${e}</span>`; }
};
document.getElementById('btnExport').onclick=async ()=>{
  if(!replay||!replay.rows.length) return;
  const st=document.getElementById('expStatus');
  const cur=ridx;
  for(let i=0;i<replay.rows.length;i++){
    gotoRow(i); await new Promise(r=>setTimeout(r,30));
    const a=document.createElement('a');
    a.download=`row_${String(replay.rows[i].seq).padStart(5,'0')}.png`;
    a.href=cv.toDataURL('image/png'); a.click();
    st.textContent=`${i+1}/${replay.rows.length}`;
    await new Promise(r=>setTimeout(r,120));
  }
  gotoRow(cur); st.textContent+=' 完成';
};
document.getElementById('btnRebuild').onclick=()=>startRebuild();
(function(){
  const t=document.getElementById('txtEd');
  let cur=0;
  t.addEventListener('keyup',()=>{ clearTimeout(cur); cur=setTimeout(followTxtCursor,250); });
  t.addEventListener('click',()=>{ clearTimeout(cur); cur=setTimeout(followTxtCursor,250); });
  t.addEventListener('select',()=>{ if(!suppressTxtSync){ clearTimeout(cur); cur=setTimeout(followTxtCursor,250); } });
  t.addEventListener('input',()=>{ followTxtCursor(); }); // 文本变化同样走即时（防抖在内）
})();
// ---------------- 启动自测 ----------------
(function(){
  const T=selfTest(), ok=T.filter(Boolean).length;
  const el=document.getElementById('selftest');
  el.textContent=`MATH ${ok}/${T.length}`; el.className=ok===T.length?'ok':'bad';
})();
</script>
